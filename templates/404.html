{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% if custom_title %}{{ custom_title }}{% else %}Page Not Found{% endif %} — UTM</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link rel="stylesheet" href="{% static 'css/error.css' %}">
</head>
<body class="bg-white font-['Outfit'] h-screen w-screen relative overflow-hidden flex items-center justify-center">

    <!-- Error Box matching Login Portal styling -->
    <div class="bg-white border border-gray-200 flex flex-col w-full max-w-2xl mx-4 md:mx-12 p-8 items-center relative z-10 shadow-2xl rounded-sm">
        
        <!-- Animated Face (Color palette from Login Page) -->
        <div class="my-custom-face-container text-[#002D74]">
                          <svg class="face" viewBox="0 0 320 380">
                  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="25">
                      <g class="face__eyes" transform="translate(0,112.5)">
                          <!-- Left Eye (Red) -->
                          <g transform="translate(15,0)" stroke="#dc2626">
                              <polyline class="face__eye-lid" points="37,0 0,120 75,120"></polyline>
                              <polyline class="face__pupil" points="55,120 55,155" stroke-dasharray="35 35"></polyline>
                          </g>
                          <!-- Right Eye (Navy Blue) -->
                          <g transform="translate(230,0)" stroke="#002D74">
                              <polyline class="face__eye-lid" points="37,0 0,120 75,120"></polyline>
                              <polyline class="face__pupil" points="55,120 55,155" stroke-dasharray="35 35"></polyline>
                          </g>
                      </g>
                      <!-- Nose (Light Blue) -->
                      <rect class="face__nose" x="132.5" y="112.5" width="55" height="155" rx="4" ry="4" stroke="#0ea5e9"></rect>
                      <!-- Mouth (Navy Blue) -->
                      <g transform="translate(65,334)" stroke-dasharray="102 102" stroke="#002D74">
                          <path class="face__mouth-left" d="M 0 30 C 0 30 40 0 95 0"></path>
                          <path class="face__mouth-right" d="M 95 0 C 150 0 190 30 190 30"></path>
                      </g>
                  </g>
              </svg>
        </div>

        <h1 class="text-4xl font-bold text-[#002D74] mb-4 tracking-tight uppercase text-center">{% if custom_title %}{{ custom_title }}{% else %}404 - Not Found{% endif %}</h1>
        
        <p class="text-lg text-[#002D74]/80 font-medium mb-8 leading-relaxed max-w-md mx-auto text-center">
            {% if custom_message %}{{ custom_message }}{% else %}Oops! The page you were looking for doesn't exist.{% endif %}
        </p>
        
        <button onclick="window.location.href='/'" class="btn-96 btn-navy shadow-lg border border-gray-300 max-w-xs w-full">
            <span>Return to Dashboard</span>
        </button>
    </div>

    

</body>
</html>
